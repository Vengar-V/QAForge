<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QAForge — QA Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#070b0f;--surf:#0c1016;--surf2:#111820;--surf3:#161f2a;
  --b1:#1c2a38;--b2:#243344;
  --ac:#00d4aa;--ac2:#0ea5e9;--acdim:#00d4aa15;
  --tx:#dde6ef;--tx2:#7a8fa0;--tx3:#374f62;
  --red:#f05a52;--yel:#dba83a;
  --fh:'Syne',sans-serif;--fm:'JetBrains Mono',monospace;--r:8px;
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--fm);font-size:13px;line-height:1.5;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--b1) 1px,transparent 1px),linear-gradient(90deg,var(--b1) 1px,transparent 1px);background-size:52px 52px;opacity:.18;pointer-events:none;}
.layout{display:flex;height:100vh;position:relative;z-index:1;}
.sb{width:216px;background:var(--surf);border-right:1px solid var(--b2);display:flex;flex-direction:column;flex-shrink:0;}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px;}
.logo-box{width:30px;height:30px;border-radius:7px;border:1px solid var(--ac);display:flex;align-items:center;justify-content:center;}
.logo-q{font-family:var(--fh);font-size:15px;font-weight:800;color:var(--ac);}
.logo-name{font-family:var(--fh);font-size:15px;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav{padding:14px 0;flex:1;}
.nav-sec{padding:5px 18px 4px;font-size:9px;letter-spacing:1.2px;color:var(--tx3);}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;color:var(--tx2);border-left:2px solid transparent;transition:all .15s;font-size:12px;}
.nav-item:hover{background:var(--surf2);color:var(--tx);}
.nav-item.active{background:var(--acdim);color:var(--ac);border-left-color:var(--ac);}
.nav-ic{width:16px;height:16px;flex-shrink:0;opacity:.7;}
.nav-item.active .nav-ic,.nav-item:hover .nav-ic{opacity:1;}
.nav-lbl{flex:1;}
.badge{background:var(--surf3);border:1px solid var(--b2);border-radius:20px;padding:1px 7px;font-size:9px;color:var(--tx2);}
.badge.alert{background:#f05a5218;border-color:#f05a5240;color:var(--red);}
.sb-user{padding:14px 18px;border-top:1px solid var(--b1);display:flex;align-items:center;gap:10px;}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#06100d;flex-shrink:0;}
.u-name{font-size:11px;color:var(--tx);}
.u-role{font-size:9px;color:var(--tx3);}
.online{width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 5px var(--ac);margin-left:auto;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.topbar{height:52px;background:var(--surf);border-bottom:1px solid var(--b2);display:flex;align-items:center;padding:0 22px;gap:12px;flex-shrink:0;}
.top-title{font-family:var(--fh);font-size:15px;font-weight:700;flex:1;}
.top-title em{font-style:normal;font-family:var(--fm);font-size:11px;font-weight:400;color:var(--tx3);margin-left:8px;}
.btn-new{display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,var(--ac),var(--ac2));border:none;border-radius:6px;padding:7px 14px;color:#06100d;font-size:11px;font-weight:700;font-family:var(--fm);cursor:pointer;letter-spacing:.4px;transition:all .2s;white-space:nowrap;}
.btn-new:hover{opacity:.88;transform:translateY(-1px);}
.ws-tabs{display:flex;border-bottom:1px solid var(--b2);background:var(--surf);padding:0 22px;flex-shrink:0;}
.ws-tab{padding:11px 18px;font-size:12px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;display:flex;align-items:center;gap:7px;margin-bottom:-1px;}
.ws-tab:hover{color:var(--tx);}
.ws-tab.active{color:var(--ac);border-bottom-color:var(--ac);}
.ws-tab-count{font-size:9px;padding:1px 6px;border-radius:10px;background:var(--surf2);border:1px solid var(--b2);}
.ws-tab.active .ws-tab-count{background:var(--acdim);border-color:#00d4aa30;color:var(--ac);}
.ws-body{display:flex;flex:1;overflow:hidden;}
.list-panel{width:320px;border-right:1px solid var(--b2);display:flex;flex-direction:column;flex-shrink:0;}
.lp-toolbar{padding:10px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:8px;}
.lp-search{flex:1;background:var(--surf2);border:1px solid var(--b2);border-radius:5px;padding:6px 10px;font-size:11px;font-family:var(--fm);color:var(--tx);outline:none;}
.lp-search::placeholder{color:var(--tx3);}
.lp-search:focus{border-color:var(--ac);}
.lp-filter{padding:6px 10px;background:var(--surf2);border:1px solid var(--b2);border-radius:5px;font-size:10px;color:var(--tx2);cursor:pointer;font-family:var(--fm);}
.item-list{flex:1;overflow-y:auto;}
.list-item{padding:12px 14px;border-bottom:1px solid var(--b1);cursor:pointer;transition:background .15s;border-left:2px solid transparent;}
.list-item:hover{background:var(--surf2);}
.list-item.selected{background:var(--acdim);border-left-color:var(--ac);}
.li-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.li-id{font-size:9px;color:var(--tx3);}
.li-title{font-size:11px;color:var(--tx);font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.li-status{font-size:8px;padding:2px 6px;border-radius:4px;flex-shrink:0;}
.li-status.pass{background:#00d4aa15;color:var(--ac);border:1px solid #00d4aa30;}
.li-status.fail{background:#f05a5215;color:var(--red);border:1px solid #f05a5230;}
.li-status.open{background:#f05a5215;color:var(--red);border:1px solid #f05a5230;}
.li-status.draft{background:#37506215;color:var(--tx3);border:1px solid var(--b2);}
.li-status.progress{background:#dba83a15;color:var(--yel);border:1px solid #dba83a30;}
.li-status.closed{background:#00d4aa15;color:var(--ac);border:1px solid #00d4aa30;}
.li-meta{font-size:9px;color:var(--tx3);display:flex;align-items:center;gap:8px;}
.li-tag{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--surf3);border:1px solid var(--b2);color:var(--tx3);}
.li-sev{font-size:8px;padding:2px 5px;border-radius:3px;}
.li-sev.critical{background:#f05a5225;color:var(--red);}
.li-sev.major{background:#dba83a20;color:var(--yel);}
.li-sev.minor{background:#0ea5e915;color:var(--ac2);}
.detail-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.dp-header{padding:16px 20px;border-bottom:1px solid var(--b1);display:flex;align-items:flex-start;gap:12px;}
.dp-id{font-size:10px;color:var(--tx3);margin-bottom:4px;}
.dp-title{font-size:15px;font-weight:600;color:var(--tx);font-family:var(--fh);}
.dp-actions{display:flex;gap:8px;flex-shrink:0;}
.dp-btn{padding:6px 12px;border-radius:5px;font-size:11px;cursor:pointer;font-family:var(--fm);transition:all .15s;border:1px solid var(--b2);background:var(--surf2);color:var(--tx2);}
.dp-btn:hover{color:var(--tx);border-color:var(--b1);}
.dp-btn.primary{background:linear-gradient(90deg,var(--ac),var(--ac2));border:none;color:#06100d;font-weight:700;}
.dp-body{overflow-y:auto;flex:1;padding:18px 20px;display:flex;flex-direction:column;gap:16px;}
.dp-meta-row{display:flex;gap:20px;flex-wrap:wrap;}
.dp-meta-item{display:flex;flex-direction:column;gap:3px;}
.dp-meta-label{font-size:9px;color:var(--tx3);letter-spacing:.8px;}
.dp-meta-val{font-size:11px;color:var(--tx);}
.dp-section{display:flex;flex-direction:column;gap:8px;}
.dp-section-title{font-size:10px;color:var(--tx3);letter-spacing:.8px;padding-bottom:6px;border-bottom:1px solid var(--b1);}
.step-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:5px;background:var(--surf2);border:1px solid var(--b1);}
.step-num{font-size:9px;color:var(--tx3);min-width:18px;margin-top:2px;}
.step-text{font-size:11px;color:var(--tx2);flex:1;line-height:1.55;}
.step-status{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;}
.step-status.ok{background:#00d4aa20;border:1px solid #00d4aa40;}
.step-status.fail{background:#f05a5220;border:1px solid #f05a5240;}
.step-status.none{background:var(--surf3);border:1px solid var(--b2);}
.expected-box{background:var(--surf2);border:1px solid var(--b1);border-radius:5px;padding:10px 12px;font-size:11px;color:var(--tx2);line-height:1.6;}
.ai-bar{padding:12px 20px;border-top:1px solid var(--b1);display:flex;align-items:center;gap:10px;background:var(--surf);flex-shrink:0;}
.ai-input{flex:1;background:var(--surf2);border:1px solid var(--b2);border-radius:6px;padding:8px 12px;font-size:11px;font-family:var(--fm);color:var(--tx);outline:none;transition:border-color .2s;}
.ai-input:focus{border-color:var(--ac);}
.ai-input::placeholder{color:var(--tx3);}
.ai-send{display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,var(--ac),var(--ac2));border:none;border-radius:6px;padding:8px 14px;color:#06100d;font-size:11px;font-weight:700;font-family:var(--fm);cursor:pointer;white-space:nowrap;}
.ai-badge{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--ac);background:var(--acdim);border:1px solid #00d4aa30;border-radius:20px;padding:3px 8px;flex-shrink:0;}
.ai-dot{width:5px;height:5px;border-radius:50%;background:var(--ac);animation:pd 1.5s ease infinite;}
@keyframes pd{0%,100%{opacity:1}50%{opacity:.3}}
.empty-detail{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--tx3);}
.empty-icon{width:44px;height:44px;border-radius:10px;background:var(--surf2);border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div class="layout">
<div class="sb">
  <div class="sb-logo"><div class="logo-box"><span class="logo-q">Q</span></div><span class="logo-name">QAForge</span></div>
  <div class="nav">
    <div class="nav-sec">OVERVIEW</div>
    <div class="nav-item"><svg class="nav-ic" viewBox="0 0 16 16" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg><span class="nav-lbl">Dashboard</span></div>
    <div class="nav-item"><svg class="nav-ic" viewBox="0 0 16 16" fill="none"><path d="M8 1v10M4 7l4 4 4-4M2 13h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-lbl">Projects</span><span class="badge">3</span></div>
    <div class="nav-sec" style="margin-top:8px">ANALYSIS</div>
    <div class="nav-item"><svg class="nav-ic" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 5v3.5l2.5 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span class="nav-lbl">Defect Analysis</span></div>
    <div class="nav-item"><svg class="nav-ic" viewBox="0 0 16 16" fill="none"><path d="M3 8h2l2-5 2 10 2-5h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-lbl">AI Generator</span></div>
    <div class="nav-item"><svg class="nav-ic" viewBox="0 0 16 16" fill="none"><path d="M8 2L9.8 6.2l4.2.6-3 3 .7 4.2L8 12l-3.7 2 .7-4.2-3-3 4.2-.6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="nav-lbl">Risk Map</span><span class="badge alert">5</span></div>
    <div class="nav-sec" style="margin-top:8px">WORKSPACE</div>
    <div class="nav-item active"><svg class="nav-ic" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 6h6M5 9h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span class="nav-lbl">Test Cases</span></div>
    <div class="nav-item"><svg class="nav-ic" viewBox="0 0 16 16" fill="none"><path d="M8 2C5.2 2 3 4.2 3 7c0 2 1.1 3.7 2.8 4.6L5 14h6l-.8-2.4C11.9 10.7 13 9 13 7c0-2.8-2.2-5-5-5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span class="nav-lbl">Bug Reports</span><span class="badge alert">2</span></div>
    <div class="nav-item"><svg class="nav-ic" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M3 8h10M3 12h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span class="nav-lbl">Reports</span></div>
  </div>
  <div class="sb-user"><div class="avatar">DV</div><div style="flex:1;min-width:0;"><div class="u-name">dev@uni.edu</div><div class="u-role">QA Engineer</div></div><div class="online"></div></div>
</div>
<div class="main">
  <div class="topbar">
    <div class="top-title">QA Workspace <em>/ test cases & bugs</em></div>
    <button class="btn-new" id="new-btn" onclick="createNew()"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span id="new-btn-label">New Test Case</span></button>
  </div>
  <div class="ws-tabs">
    <div class="ws-tab active" id="tab-tc" onclick="switchTab('tc')"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 6h6M5 9h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Test Cases <span class="ws-tab-count">8</span></div>
    <div class="ws-tab" id="tab-br" onclick="switchTab('br')"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M8 2C5.2 2 3 4.2 3 7c0 2 1.1 3.7 2.8 4.6L5 14h6l-.8-2.4C11.9 10.7 13 9 13 7c0-2.8-2.2-5-5-5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Bug Reports <span class="ws-tab-count">5</span></div>
  </div>
  <div class="ws-body">
    <div class="list-panel">
      <div class="lp-toolbar"><input class="lp-search" placeholder="Search..." oninput="filterList(this.value)"/><div class="lp-filter">All</div></div>
      <div class="item-list" id="item-list"></div>
    </div>
    <div class="detail-panel" id="detail-panel">
      <div class="empty-detail" id="empty-detail">
        <div class="empty-icon"><svg width="20" height="20" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="12" height="12" rx="2" stroke="var(--tx3)" stroke-width="1.4"/><path d="M5 6h6M5 9h4" stroke="var(--tx3)" stroke-width="1.4" stroke-linecap="round"/></svg></div>
        <div style="font-size:12px;color:var(--tx2)">Select an item to view</div>
        <div style="font-size:10px;text-align:center;max-width:180px;line-height:1.6">Click any test case or bug report from the list</div>
      </div>
      <div id="detail-content"></div>
    </div>
  </div>
</div>
</div>
<script>
const testCases=[
  {id:'TC-001',title:'Valid session token creation',status:'pass',file:'auth/session.py',priority:'High',type:'Unit',steps:['Call create_session() with valid credentials','Assert token is not null','Verify token expiry matches TTL','Check token stored in session store'],expected:'Session token created successfully with correct expiry time',tags:['auth','session']},
  {id:'TC-002',title:'Expired token rejection',status:'fail',file:'auth/session.py',priority:'High',type:'Edge Case',steps:['Create token with past expiry timestamp','Attempt to authenticate','Assert 401 Unauthorized returned','Verify no session data leaked'],expected:'Returns 401 with error message, no internal state exposed',tags:['auth','security']},
  {id:'TC-003',title:'Concurrent session limit',status:'draft',file:'auth/session.py',priority:'Medium',type:'Integration',steps:['Create MAX_SESSIONS active sessions','Attempt to create one more','Assert oldest session invalidated','Verify new session created'],expected:'New session created, oldest session terminated',tags:['auth','concurrency']},
  {id:'TC-004',title:'Dependency injection resolution',status:'pass',file:'routing/deps.py',priority:'High',type:'Unit',steps:['Define route with nested deps','Invoke via test client','Assert all deps resolved in order','Verify no duplicate instantiation'],expected:'All dependencies resolved correctly without duplicates',tags:['routing','di']},
  {id:'TC-005',title:'Missing dependency raises 422',status:'pass',file:'routing/deps.py',priority:'High',type:'Negative',steps:['Create route with required header dep','Send request without header','Assert 422 response','Verify field-level error details'],expected:'HTTP 422 with field-level validation errors',tags:['routing','validation']},
  {id:'TC-006',title:'HTTP adapter retry logic',status:'draft',file:'adapters/http.py',priority:'Medium',type:'Integration',steps:['Mock endpoint to fail 2x then succeed','Execute request via adapter','Assert 3 total attempts','Verify successful final response'],expected:'Adapter retries twice, returns successful response on 3rd try',tags:['http','retry']},
  {id:'TC-007',title:'Null token handling',status:'fail',file:'auth/session.py',priority:'High',type:'Negative',steps:['Send request with empty Authorization','Assert 401 returned immediately','Verify no downstream processing','Check error hides internal state'],expected:'401 returned immediately with safe error message',tags:['auth','null']},
  {id:'TC-008',title:'Response model serialization',status:'pass',file:'models/response.py',priority:'Low',type:'Unit',steps:['Instantiate ResponseModel with all fields','Call .json()','Assert only declared fields present','Verify types match schema'],expected:'JSON output matches schema with correct field types',tags:['model','json']},
];
const bugReports=[
  {id:'BUG-047',title:'NullPointerException in routing/deps.py',status:'open',severity:'critical',file:'routing/deps.py',reporter:'pwang',steps:['Send POST /api/items without auth header','Server returns 500 instead of 401','Check server logs for NPE stack trace'],expected:'Should return 401 Unauthorized',actual:'Returns 500 Internal Server Error with NPE',tags:['routing','critical']},
  {id:'BUG-046',title:'Session not invalidated after password change',status:'progress',severity:'major',file:'auth/session.py',reporter:'jsmith',steps:['Login as user A','Change password via /api/user/password','Attempt API call with old session token'],expected:'Old session token should be invalidated',actual:'Old token still works for 5 minutes after password change',tags:['auth','security']},
  {id:'BUG-045',title:'HTTP adapter ignores timeout on retry',status:'closed',severity:'major',file:'adapters/http.py',reporter:'mlee',steps:['Configure adapter with 2s timeout','Mock endpoint to delay 10s','Execute request with retry enabled'],expected:'Timeout applied to each retry attempt',actual:'Timeout only applied to first attempt, retries have no timeout',tags:['http','retry']},
  {id:'BUG-044',title:'Response model includes internal _id field',status:'open',severity:'minor',file:'models/response.py',reporter:'akowal',steps:['Call GET /api/items endpoint','Inspect JSON response body'],expected:'Response should not contain _id field',actual:'Internal MongoDB _id field leaked in response',tags:['model','leak']},
  {id:'BUG-043',title:'Race condition in concurrent session creation',status:'closed',severity:'critical',file:'auth/session.py',reporter:'jsmith',steps:['Send 10 concurrent login requests for same user','Check session store state'],expected:'Max sessions limit enforced correctly',actual:'Up to 15 sessions created due to race condition',tags:['auth','concurrency']},
];
let currentTab='tc',selectedId=null;
function switchTab(tab){
  currentTab=tab;
  document.getElementById('tab-tc').classList.toggle('active',tab==='tc');
  document.getElementById('tab-br').classList.toggle('active',tab==='br');
  document.getElementById('new-btn-label').textContent=tab==='tc'?'New Test Case':'New Bug Report';
  selectedId=null;showEmpty();renderList('');
}
function renderList(filter){
  const list=document.getElementById('item-list');list.innerHTML='';
  const items=currentTab==='tc'?testCases:bugReports;
  const f=filter.toLowerCase();
  items.filter(i=>!f||i.title.toLowerCase().includes(f)||i.id.toLowerCase().includes(f)).forEach((item,idx)=>{
    const el=document.createElement('div');
    el.className='list-item'+(selectedId===item.id?' selected':'');
    if(currentTab==='tc'){el.innerHTML=`<div class="li-header"><span class="li-id">${item.id}</span><span class="li-title">${item.title}</span><span class="li-status ${item.status}">${item.status}</span></div><div class="li-meta"><span>${item.file}</span><span class="li-tag">${item.type}</span></div>`;}
    else{el.innerHTML=`<div class="li-header"><span class="li-id">${item.id}</span><span class="li-title">${item.title}</span><span class="li-status ${item.status}">${item.status}</span></div><div class="li-meta"><span>${item.file}</span><span class="li-sev ${item.severity}">${item.severity}</span></div>`;}
    el.onclick=()=>selectItem(item.id);
    list.appendChild(el);
  });
}
function selectItem(id){
  selectedId=id;renderList(document.querySelector('.lp-search').value);
  const items=currentTab==='tc'?testCases:bugReports;
  const item=items.find(i=>i.id===id);if(!item)return;
  document.getElementById('empty-detail').style.display='none';
  const dc=document.getElementById('detail-content');
  dc.style.cssText='display:flex;flex-direction:column;flex:1;overflow:hidden;height:100%';
  if(currentTab==='tc'){
    dc.innerHTML=`<div class="dp-header"><div style="flex:1"><div class="dp-id">${item.id} · ${item.file}</div><div class="dp-title">${item.title}</div></div><div class="dp-actions"><div class="dp-btn">Edit</div><div class="dp-btn primary">Run Test</div></div></div><div class="dp-body"><div class="dp-meta-row"><div class="dp-meta-item"><div class="dp-meta-label">STATUS</div><div class="dp-meta-val"><span class="li-status ${item.status}">${item.status}</span></div></div><div class="dp-meta-item"><div class="dp-meta-label">PRIORITY</div><div class="dp-meta-val">${item.priority}</div></div><div class="dp-meta-item"><div class="dp-meta-label">TYPE</div><div class="dp-meta-val">${item.type}</div></div><div class="dp-meta-item"><div class="dp-meta-label">FILE</div><div class="dp-meta-val" style="color:var(--ac)">${item.file}</div></div></div><div class="dp-section"><div class="dp-section-title">TEST STEPS</div>${item.steps.map((s,i)=>`<div class="step-row"><span class="step-num">${i+1}.</span><span class="step-text">${s}</span><div class="step-status none" onclick="toggleStep(this)"></div></div>`).join('')}</div><div class="dp-section"><div class="dp-section-title">EXPECTED RESULT</div><div class="expected-box">${item.expected}</div></div><div class="dp-section"><div class="dp-section-title">TAGS</div><div style="display:flex;gap:6px;flex-wrap:wrap">${item.tags.map(t=>`<span class="li-tag">${t}</span>`).join('')}</div></div></div><div class="ai-bar"><div class="ai-badge"><div class="ai-dot"></div>AI</div><input class="ai-input" placeholder="Ask AI to improve this test case..."/><button class="ai-send">Ask</button></div>`;
  } else {
    dc.innerHTML=`<div class="dp-header"><div style="flex:1"><div class="dp-id">${item.id} · ${item.file} · by ${item.reporter}</div><div class="dp-title">${item.title}</div></div><div class="dp-actions"><div class="dp-btn">Edit</div><div class="dp-btn primary">Generate Fix Test</div></div></div><div class="dp-body"><div class="dp-meta-row"><div class="dp-meta-item"><div class="dp-meta-label">STATUS</div><div class="dp-meta-val"><span class="li-status ${item.status}">${item.status}</span></div></div><div class="dp-meta-item"><div class="dp-meta-label">SEVERITY</div><div class="dp-meta-val"><span class="li-sev ${item.severity}">${item.severity}</span></div></div><div class="dp-meta-item"><div class="dp-meta-label">FILE</div><div class="dp-meta-val" style="color:var(--ac)">${item.file}</div></div><div class="dp-meta-item"><div class="dp-meta-label">REPORTER</div><div class="dp-meta-val">${item.reporter}</div></div></div><div class="dp-section"><div class="dp-section-title">STEPS TO REPRODUCE</div>${item.steps.map((s,i)=>`<div class="step-row"><span class="step-num">${i+1}.</span><span class="step-text">${s}</span></div>`).join('')}</div><div class="dp-section"><div class="dp-section-title">EXPECTED RESULT</div><div class="expected-box">${item.expected}</div></div><div class="dp-section"><div class="dp-section-title">ACTUAL RESULT</div><div class="expected-box" style="border-color:#f05a5230;background:#f05a5208;">${item.actual}</div></div><div class="dp-section"><div class="dp-section-title">TAGS</div><div style="display:flex;gap:6px;flex-wrap:wrap">${item.tags.map(t=>`<span class="li-tag">${t}</span>`).join('')}</div></div></div><div class="ai-bar"><div class="ai-badge"><div class="ai-dot"></div>AI</div><input class="ai-input" placeholder="Ask AI to suggest a fix or generate a test..."/><button class="ai-send">Ask</button></div>`;
  }
}
function showEmpty(){document.getElementById('empty-detail').style.display='flex';document.getElementById('detail-content').style.display='none';}
function filterList(v){renderList(v);}
function toggleStep(el){const s=['none','ok','fail'];const c=el.classList.contains('ok')?'ok':el.classList.contains('fail')?'fail':'none';const n=s[(s.indexOf(c)+1)%3];el.className='step-status '+n;el.innerHTML=n==='ok'?'<svg width="8" height="8" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5L8 3" stroke="var(--ac)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>':n==='fail'?'<svg width="8" height="8" viewBox="0 0 10 10" fill="none"><path d="M2 2l6 6M8 2l-6 6" stroke="var(--red)" stroke-width="1.5" stroke-linecap="round"/></svg>':'';}
function createNew(){alert(currentTab==='tc'?'New Test Case form':'New Bug Report form');}
renderList('');
</script>
