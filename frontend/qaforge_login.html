<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QAForge — Login</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080c10;--surface:#0d1117;--surface2:#131920;--surface3:#1a2332;
  --border:#1e2d3d;--border2:#2a3f52;
  --accent:#00d4aa;--accent2:#0ea5e9;--accent-dim:#00d4aa22;
  --text:#e6edf3;--text2:#8b949e;--text3:#3d4f60;
  --red:#f85149;--font-head:'Syne',sans-serif;--font-mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-mono);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:48px 48px;opacity:.35;pointer-events:none;}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;animation:orbFloat 8s ease-in-out infinite;}
.orb1{width:400px;height:400px;background:radial-gradient(circle,#00d4aa18,transparent 70%);top:-100px;left:-80px;}
.orb2{width:350px;height:350px;background:radial-gradient(circle,#0ea5e918,transparent 70%);bottom:-80px;right:-60px;animation-delay:-4s;}
@keyframes orbFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
.card{position:relative;width:440px;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:40px;z-index:10;animation:cardIn .6s cubic-bezier(.16,1,.3,1) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.card::before{content:'';position:absolute;top:0;left:40px;right:40px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7;}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;}
.logo-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#00d4aa22,#0ea5e933);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accent);font-weight:700;}
.logo-text{font-family:var(--font-head);font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-badge{margin-left:auto;font-size:10px;color:var(--text3);border:1px solid var(--border2);border-radius:4px;padding:2px 7px;letter-spacing:.5px;}
.tabs{display:flex;gap:0;margin-bottom:28px;border:1px solid var(--border2);border-radius:8px;padding:3px;}
.tab{flex:1;padding:8px;text-align:center;font-size:12px;font-family:var(--font-mono);color:var(--text2);cursor:pointer;border-radius:5px;transition:all .2s;letter-spacing:.5px;border:none;background:transparent;}
.tab.active{background:var(--surface2);color:var(--accent);box-shadow:0 0 0 1px var(--border2);}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:6px;letter-spacing:.8px;}
.field label span{color:var(--accent);margin-right:4px;}
.field input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:10px 14px;font-size:13px;font-family:var(--font-mono);color:var(--text);outline:none;transition:all .2s;letter-spacing:.3px;}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.field input::placeholder{color:var(--text3)}
.field input.error{border-color:var(--red);box-shadow:0 0 0 3px #f8514915}
.err-msg{font-size:11px;color:var(--red);margin-top:5px;display:none;letter-spacing:.3px;}
.err-msg.show{display:block}
.strength{margin-top:6px;display:none}
.strength.show{display:block}
.strength-bars{display:flex;gap:3px;margin-bottom:4px}
.bar{height:3px;flex:1;border-radius:2px;background:var(--border2);transition:background .3s;}
.bar.weak{background:var(--red)}.bar.medium{background:#e3b341}.bar.strong{background:var(--accent)}
.strength-label{font-size:10px;color:var(--text3);letter-spacing:.5px;}
.submit-btn{width:100%;padding:12px;background:linear-gradient(90deg,#00d4aa,#0ea5e9);border:none;border-radius:7px;color:#080c10;font-size:13px;font-weight:700;font-family:var(--font-mono);cursor:pointer;letter-spacing:.8px;margin-top:8px;transition:all .2s;position:relative;overflow:hidden;}
.submit-btn:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 6px 24px #00d4aa25}
.submit-btn:active{transform:translateY(0)}
.submit-btn .btn-text{transition:opacity .2s}
.submit-btn.loading .btn-text{opacity:0}
.submit-btn .spinner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;}
.submit-btn.loading .spinner{display:flex}
.spinner-ring{width:18px;height:18px;border:2px solid #08121a55;border-top-color:#08121a;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:11px;letter-spacing:.5px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border2)}
.github-btn{width:100%;padding:10px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text2);font-size:12px;font-family:var(--font-mono);cursor:pointer;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;}
.github-btn:hover{border-color:var(--border);color:var(--text);background:#1a2332}
.github-icon{width:16px;height:16px;fill:currentColor}
.footer-link{text-align:center;margin-top:22px;font-size:11px;color:var(--text3);letter-spacing:.3px;}
.footer-link a{color:var(--accent);text-decoration:none;cursor:pointer;}
.footer-link a:hover{text-decoration:underline}
.cursor{display:inline-block;width:7px;height:13px;background:var(--accent);margin-left:2px;animation:blink 1.1s step-end infinite;vertical-align:middle;border-radius:1px;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.terminal-line{font-size:11px;color:var(--text3);margin-bottom:20px;letter-spacing:.3px;display:flex;align-items:center;gap:4px;}
.terminal-line .prompt{color:var(--accent)}
.register-only{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.16,1,.3,1),opacity .25s;opacity:0;}
.register-only.show{max-height:200px;opacity:1}
.success-screen{display:none;text-align:center;animation:cardIn .4s cubic-bezier(.16,1,.3,1) both;}
.success-screen.show{display:block}
.success-icon{width:56px;height:56px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px;background:var(--accent-dim);animation:pulse 1.5s ease infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #00d4aa33}50%{box-shadow:0 0 0 12px transparent}}
.success-title{font-family:var(--font-head);font-size:22px;font-weight:700;margin-bottom:8px}
.success-sub{font-size:12px;color:var(--text2);letter-spacing:.3px;}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon">Q</div>
    <div class="logo-text">QAForge</div>
    <div class="logo-badge">v0.1-alpha</div>
  </div>
  <div class="terminal-line">
    <span class="prompt">$</span>
    <span id="typed-text"></span>
    <span class="cursor"></span>
  </div>
  <div id="main-form">
    <div class="tabs">
      <button class="tab active" onclick="setTab('login')">// login</button>
      <button class="tab" onclick="setTab('register')">// register</button>
    </div>
    <div class="field">
      <label><span>→</span>email</label>
      <input type="email" id="email" placeholder="dev@company.com" oninput="clearErr('email')"/>
      <div class="err-msg" id="email-err">invalid email address</div>
    </div>
    <div class="register-only" id="reg-name">
      <div class="field">
        <label><span>→</span>full_name</label>
        <input type="text" id="name" placeholder="John Doe"/>
      </div>
    </div>
    <div class="field">
      <label><span>→</span>password</label>
      <input type="password" id="password" placeholder="••••••••••••" oninput="checkStrength(this.value);clearErr('password')"/>
      <div class="err-msg" id="password-err">password too short (min 8)</div>
      <div class="strength" id="strength-wrap">
        <div class="strength-bars">
          <div class="bar" id="b1"></div><div class="bar" id="b2"></div>
          <div class="bar" id="b3"></div><div class="bar" id="b4"></div>
        </div>
        <div class="strength-label" id="strength-label">strength: —</div>
      </div>
    </div>
    <button class="submit-btn" id="submit-btn" onclick="handleSubmit()">
      <span class="btn-text" id="btn-label">AUTHENTICATE</span>
      <div class="spinner"><div class="spinner-ring"></div></div>
    </button>
    <div class="divider">or</div>
    <button class="github-btn">
      <svg class="github-icon" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      Continue with GitHub
    </button>
    <div class="footer-link">
      <span id="footer-text">no account? </span>
      <a onclick="setTab('register')" id="footer-link-btn">register →</a>
    </div>
  </div>
  <div class="success-screen" id="success-screen">
    <div class="success-icon">✓</div>
    <div class="success-title">Access granted</div>
    <div class="success-sub">redirecting to dashboard...<span class="cursor"></span></div>
  </div>
</div>
<script>
let currentTab='login';
const phrases=['init auth module...','connecting to QAForge...','ready.'];
let pi=0,ci=0;
const el=document.getElementById('typed-text');
function typeNext(){if(pi>=phrases.length)return;if(ci<phrases[pi].length){el.textContent+=phrases[pi][ci++];setTimeout(typeNext,55+Math.random()*30);}else{if(pi<phrases.length-1){setTimeout(()=>{el.textContent='';ci=0;pi++;setTimeout(typeNext,200);},700);}}}
setTimeout(typeNext,400);
function setTab(tab){currentTab=tab;document.querySelectorAll('.tab').forEach((t,i)=>{t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='register'));});const rn=document.getElementById('reg-name');const sw=document.getElementById('strength-wrap');if(tab==='register'){rn.classList.add('show');sw.classList.add('show');document.getElementById('btn-label').textContent='CREATE ACCOUNT';document.getElementById('footer-text').textContent='have account? ';document.getElementById('footer-link-btn').textContent='login →';document.getElementById('footer-link-btn').onclick=()=>setTab('login');}else{rn.classList.remove('show');sw.classList.remove('show');document.getElementById('btn-label').textContent='AUTHENTICATE';document.getElementById('footer-text').textContent='no account? ';document.getElementById('footer-link-btn').textContent='register →';document.getElementById('footer-link-btn').onclick=()=>setTab('register');}clearErr('email');clearErr('password');}
function checkStrength(val){const w=document.getElementById('strength-wrap');if(!val){w.classList.remove('show');return;}w.classList.add('show');const bars=[document.getElementById('b1'),document.getElementById('b2'),document.getElementById('b3'),document.getElementById('b4')];bars.forEach(b=>{b.className='bar'});let score=0;if(val.length>=8)score++;if(val.length>=12)score++;if(/[A-Z]/.test(val)&&/[0-9]/.test(val))score++;if(/[^A-Za-z0-9]/.test(val))score++;const cls=score<=1?'weak':score<=2?'medium':'strong';const labels=['','weak','medium','strong','strong'];for(let i=0;i<score;i++)bars[i].classList.add(cls);document.getElementById('strength-label').textContent='strength: '+(labels[score]||'—');}
function clearErr(field){const input=document.getElementById(field);const msg=document.getElementById(field+'-err');if(input)input.classList.remove('error');if(msg)msg.classList.remove('show');}
function validate(){let ok=true;const email=document.getElementById('email').value;const password=document.getElementById('password').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){document.getElementById('email').classList.add('error');document.getElementById('email-err').classList.add('show');ok=false;}if(password.length<8){document.getElementById('password').classList.add('error');document.getElementById('password-err').classList.add('show');ok=false;}return ok;}
function handleSubmit(){if(!validate())return;const btn=document.getElementById('submit-btn');btn.classList.add('loading');setTimeout(()=>{btn.classList.remove('loading');document.getElementById('main-form').style.display='none';document.getElementById('success-screen').classList.add('show');},1800);}
</script>
</body>
</html>
