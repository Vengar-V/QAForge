spring:
  application:
    name: qaforge-backend

  # ── DATABASE ──────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/qaforge
    username: postgres
    password: 1234        # змін на свій пароль
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway керує схемою, Hibernate тільки валідує
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── FLYWAY (автоміграції) ─────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── FILE UPLOAD (для ZIP імпорту) ─────────────────────
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# ── SERVER ────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api

# ── JWT ───────────────────────────────────────────────────
jwt:
  secret: qaforge-super-secret-key-change-in-production-min-256-bits
  expiration: 86400000        # 24 години в мілісекундах

# ── CLAUDE API ────────────────────────────────────────────
claude:
  api:
    key: ${CLAUDE_API_KEY:your-api-key-here}
    url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-20250514
    max-tokens: 4096

# ── GITHUB OAUTH ──────────────────────────────────────────
github:
  client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
  client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}

# ── LOGGING ───────────────────────────────────────────────
logging:
  level:
    com.qaforge: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
